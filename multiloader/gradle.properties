org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Points Gradle at a real JDK 17+ install instead of whatever "java" resolves
# to on the system PATH (which was JDK 8 - too old for Gradle itself to run on).
# This is the same JDK IntelliJ already uses successfully.
org.gradle.java.home=C:\\Users\\josia\\.jdks\\openjdk-26.0.1

# Mod Properties
mod_version=1.0.0
maven_group=com.joplayx
archives_base_name=villager-reroll

# Minecraft
minecraft_version=26.2
platforms=fabric,neoforge

# Architectury tooling
# check https://maven.architectury.dev/ for current versions
architectury_plugin_version=3.5-SNAPSHOT
architectury_loom_version=1.17-SNAPSHOT
architectury_api_version=21.0.4

# Fabric
fabric_loader_version=0.19.3
fabric_api_version=0.155.2+26.2
mod_menu_version=20.0.1
yacl_version=3.9.5+26.2-fabric

# NeoForge
# NOTE: 26.2 is a brand-new MC version as of writing this - double check
# https://projects.neoforged.net/neoforged/neoforge for a newer non-beta
# build before you rely on this one long-term.
neoforge_version=26.2.0.1-beta
